<svg viewBox="0 0 1200 820" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">BobSwarm orchestration flow</title>
  <desc id="desc">The dashboard creates a run, an operator hands it to IBM Bob, four specialists run in parallel, the Refactorer follows the Debugger, and MCP events produce a unified report.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#141a24"/><stop offset="1" stop-color="#090c11"/></linearGradient>
    <linearGradient id="violet" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#a371f7"/><stop offset="1" stop-color="#e879c9"/></linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#e8b339"/><stop offset="1" stop-color="#f0d878"/></linearGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse"><circle cx="1.5" cy="1.5" r="1" fill="#1b2129"/></pattern>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 10 5 0 10Z" fill="#697386"/></marker>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="4" stdDeviation="7" flood-color="#000" flood-opacity=".45"/></filter>
  </defs>

  <rect width="1200" height="820" rx="24" fill="url(#background)"/><rect width="1200" height="820" rx="24" fill="url(#grid)"/>
  <text x="600" y="28" fill="#8b949e" font-family="Inter,Segoe UI,sans-serif" font-size="12" text-anchor="middle" letter-spacing="2">HONEST OPERATOR FLOW · LIVE MCP TELEMETRY</text>

  <g fill="none" stroke="#697386" stroke-width="2.5" marker-end="url(#arrow)">
    <path d="M300 92h155"/><path d="M745 92h155"/><path d="M1025 145v43"/>
    <path d="M1025 188C1025 205 165 185 165 218"/><path d="M1025 188C1025 205 455 185 455 218"/>
    <path d="M1025 188C1025 205 745 185 745 218"/><path d="M1025 188C1025 205 1035 185 1035 218"/>
    <path d="M165 328C165 375 600 355 600 390" stroke="#f85149"/><path d="M455 328C455 385 600 355 600 390" stroke="#58a6ff"/>
    <path d="M745 328C745 375 600 355 600 390" stroke="#3fb950"/><path d="M1035 328C1035 385 600 355 600 390" stroke="#d29922"/>
    <path d="M600 500v45"/><path d="M600 655v42" stroke="#e8b339"/>
  </g>

  <g font-family="Inter,Segoe UI,sans-serif" text-anchor="middle">
    <g filter="url(#shadow)">
      <rect x="50" y="48" width="250" height="96" rx="16" fill="#12161d" stroke="#8b949e" stroke-width="2"/>
      <text x="175" y="84" fill="#eef2f6" font-size="18" font-weight="700">Dashboard</text><text x="175" y="108" fill="#8b949e" font-family="JetBrains Mono,monospace" font-size="12">create pending run + UUID</text><text x="175" y="128" fill="#c9a6ff" font-family="JetBrains Mono,monospace" font-size="11">task type is explicit</text>
      <rect x="455" y="48" width="290" height="96" rx="16" fill="#12161d" stroke="#e8b339" stroke-width="2"/>
      <text x="600" y="84" fill="#eef2f6" font-size="18" font-weight="700">Operator handoff</text><text x="600" y="108" fill="#8b949e" font-family="JetBrains Mono,monospace" font-size="12">copy exact run ID into Bob</text><text x="600" y="128" fill="#f0d878" font-family="JetBrains Mono,monospace" font-size="11">no hidden browser dispatch</text>
      <rect x="900" y="48" width="250" height="96" rx="16" fill="#12161d" stroke="url(#violet)" stroke-width="2.5"/>
      <text x="1025" y="84" fill="#eef2f6" font-size="18" font-weight="700">IBM Bob</text><text x="1025" y="108" fill="#c9a6ff" font-family="JetBrains Mono,monospace" font-size="12">custom mode + skill</text><text x="1025" y="128" fill="#8b949e" font-family="JetBrains Mono,monospace" font-size="11">spawn_subagent</text>
    </g>

    <text x="600" y="176" fill="#c9a6ff" font-family="JetBrains Mono,monospace" font-size="12">first wave · independent specialists</text>
    <g filter="url(#shadow)">
      <rect x="40" y="218" width="250" height="110" rx="16" fill="#12161d" stroke="#f85149" stroke-width="2"/><text x="165" y="257" fill="#eef2f6" font-size="17" font-weight="700">Debugger</text><text x="165" y="282" fill="#8b949e" font-family="JetBrains Mono,monospace" font-size="12">defects + root causes</text><text x="165" y="304" fill="#f85149" font-family="JetBrains Mono,monospace" font-size="11">parallel</text>
      <rect x="330" y="218" width="250" height="110" rx="16" fill="#12161d" stroke="#58a6ff" stroke-width="2"/><text x="455" y="257" fill="#eef2f6" font-size="17" font-weight="700">Documenter</text><text x="455" y="282" fill="#8b949e" font-family="JetBrains Mono,monospace" font-size="12">public API + overview</text><text x="455" y="304" fill="#58a6ff" font-family="JetBrains Mono,monospace" font-size="11">parallel</text>
      <rect x="620" y="218" width="250" height="110" rx="16" fill="#12161d" stroke="#3fb950" stroke-width="2"/><text x="745" y="257" fill="#eef2f6" font-size="17" font-weight="700">Onboarding</text><text x="745" y="282" fill="#8b949e" font-family="JetBrains Mono,monospace" font-size="12">setup + first contribution</text><text x="745" y="304" fill="#3fb950" font-family="JetBrains Mono,monospace" font-size="11">parallel</text>
      <rect x="910" y="218" width="250" height="110" rx="16" fill="#12161d" stroke="#d29922" stroke-width="2"/><text x="1035" y="257" fill="#eef2f6" font-size="17" font-weight="700">Data Lineage</text><text x="1035" y="282" fill="#8b949e" font-family="JetBrains Mono,monospace" font-size="12">ingress → transforms → egress</text><text x="1035" y="304" fill="#d29922" font-family="JetBrains Mono,monospace" font-size="11">parallel</text>
    </g>

    <g filter="url(#shadow)">
      <rect x="475" y="390" width="250" height="110" rx="16" fill="#12161d" stroke="#e879c9" stroke-width="2"/><text x="600" y="429" fill="#eef2f6" font-size="17" font-weight="700">Refactorer</text><text x="600" y="454" fill="#8b949e" font-family="JetBrains Mono,monospace" font-size="12">safe changes + rationale</text><text x="600" y="476" fill="#e879c9" font-family="JetBrains Mono,monospace" font-size="11">after Debugger context</text>
    </g>
    <text x="742" y="386" fill="#f0d878" font-family="JetBrains Mono,monospace" font-size="11" text-anchor="start">dependency gate</text>
    <g filter="url(#shadow)">
      <rect x="475" y="545" width="250" height="110" rx="16" fill="#12161d" stroke="#a371f7" stroke-width="2"/><text x="600" y="584" fill="#eef2f6" font-size="17" font-weight="700">MCP event bridge</text><text x="600" y="609" fill="#8b949e" font-family="JetBrains Mono,monospace" font-size="12">progress + literal findings</text><text x="600" y="631" fill="#c9a6ff" font-family="JetBrains Mono,monospace" font-size="11">sequenced WebSocket events</text>
      <rect x="475" y="697" width="250" height="90" rx="16" fill="#12161d" stroke="url(#gold)" stroke-width="2.5"/><text x="600" y="734" fill="#eef2f6" font-size="17" font-weight="700">Unified report</text><text x="600" y="758" fill="#f0d878" font-family="JetBrains Mono,monospace" font-size="12">deterministic + evidence-backed</text>
    </g>
  </g>
</svg>
